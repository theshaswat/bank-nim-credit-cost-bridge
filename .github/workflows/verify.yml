name: verify

# What this does and does not prove.
#
# It does not rebuild the bridge from the seven investor decks. Nothing in src/
# opens a PDF: the figures were transcribed by hand against the printed page
# numbers recorded in the source_page_note column of
# data/final/verified_inputs.csv, and the pipeline starts from that CSV. The
# decks are not committed either -- they are third-party copyrighted documents,
# and data/raw/source_manifest.md identifies each one by URL, retrieval time
# and SHA-256 so a reader can obtain and verify it.
#
# Three things get checked, in order of how much they mean:
#
#   1. The reconciliation checks pass. src/nim_bridge.py exits non-zero and
#      refuses to write the bridge if any of the four fails, so a broken
#      extraction stops here rather than producing a plausible-looking bridge.
#   2. The committed data artifacts reproduce byte for byte. The CSVs, the
#      reconciliation log and the dashboard are plain text built from the CSVs,
#      and nothing in them depends on the machine, so an exact diff is the right
#      test. It catches a figure edited by hand without rerunning what produces it.
#   3. The tests pass, including the ones that assert the README and the memo
#      still quote the same numbers the CSVs hold.
#
# Charts and the PDF are rebuilt as a smoke test and deliberately not compared.
# matplotlib renders text differently on Linux than on macOS, so the PNGs differ
# between a correct local build and a correct CI build, and the memo embeds them.
# The PDF is byte-reproducible for a given machine (rl_config.invariant), just
# not across platforms.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: The two records of the source hashes still agree
        # The decks are not in the repository, so there is nothing here to
        # hash. What can still go wrong is the two places recording those
        # hashes drifting apart -- data/raw/SHA256SUMS, which a reader runs
        # shasum against, and the table in data/raw/source_manifest.md, which
        # carries the same hash beside the URL it came from. If someone edits
        # one and forgets the other, the next reader gets a false OK.
        run: |
          python - <<'PY'
          import re, sys
          from pathlib import Path

          sums = {}
          for line in Path("data/raw/SHA256SUMS").read_text().splitlines():
              if line.strip():
                  h, name = line.split()
                  sums[name.strip()] = h

          manifest = Path("data/raw/source_manifest.md").read_text()
          rows = dict(re.findall(r"\| (investor_decks/\S+\.pdf) .*?`([0-9a-f]{64})`", manifest))

          if sums != rows:
              for name in sorted(set(sums) | set(rows)):
                  a, b = sums.get(name), rows.get(name)
                  print(("ok   " if a == b else "DIFF ") + name)
                  if a != b:
                      print(f"       SHA256SUMS      {a}")
                      print(f"       source_manifest {b}")
              sys.exit("SHA256SUMS and source_manifest.md disagree")
          print(f"ok: both records list the same {len(sums)} documents and hashes")
          PY

      - name: Reconciliation checks pass and the bridge rebuilds
        run: python src/nim_bridge.py

      - name: Dashboard rebuilds
        run: python src/build_dashboard.py

      - name: Committed data artifacts reproduce exactly
        run: git diff --exit-code -- data/final data/processed outputs/dashboard

      - name: Tests
        run: |
          pip install pytest
          pytest -q

      - name: Charts and memo still build
        run: |
          python src/build_charts.py
          python src/build_pdf.py
